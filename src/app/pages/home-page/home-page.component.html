<div class="home-container">

  <section class="home-section">
    <div class="feed-tabs" *ngIf="!reviewIdFromUrl" role="tablist">
      <button
        type="button"
        role="tab"
        class="feed-tab"
        [class.active]="currentMode === 'all'"
        [attr.aria-selected]="currentMode === 'all'"
        (click)="setMode('all')">
        Para ti
      </button>
      <button
        type="button"
        role="tab"
        class="feed-tab"
        [class.active]="currentMode === 'following'"
        [attr.aria-selected]="currentMode === 'following'"
        (click)="setMode('following')">
        Siguiendo
      </button>
    </div>

    <app-review-feed
      [highlightReviewId]="reviewIdFromUrl"
      [mode]="currentMode"
      [followingIds]="followingIds">
    </app-review-feed>
  </section>

  <router-outlet></router-outlet>
</div>
