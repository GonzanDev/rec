<div class="home-container">
  


  <section class="home-section">
    <div class="feed-header">
      <h2 class="section-title">Actividad Reciente</h2>
      
      <div class="feed-tabs" *ngIf="!reviewIdFromUrl">
        <button 
          class="pill-btn"
          [class.active]="currentMode === 'all'" 
          (click)="setMode('all')">
          Global
        </button>
        <button 
          class="pill-btn"
          [class.active]="currentMode === 'following'" 
          (click)="setMode('following')">
          Siguiendo
        </button>
        <span class="tab-divider"></span>
        <button 
          class="pill-btn"
          [class.active]="currentSort === 'recent'" 
          (click)="setSort('recent')">
          Recientes
        </button>
        <button 
          class="pill-btn"
          [class.active]="currentSort === 'popular'" 
          (click)="setSort('popular')">
          Más gustadas
        </button>
      </div>
    </div>

    <app-review-feed
      [highlightReviewId]="reviewIdFromUrl"
      [mode]="currentMode"
      [sort]="currentSort"
      [followingIds]="followingIds">
    </app-review-feed>
  </section>

  <router-outlet></router-outlet>
</div>
