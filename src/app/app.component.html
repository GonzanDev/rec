<ng-container *ngIf="userId$ | async as userId; else unauthLayout">
  <div class="app-layout">
    <!-- Sidebar Izquierdo (Nav + Profile) -->
    <aside class="sidebar-left">
      <div class="sidebar-logo">
        <i class="fa fa-spotify" style="color: var(--verde); font-size: 2rem;"></i>
        <h2>Musicboxd</h2>
      </div>
      <nav class="sidebar-nav">
        <a routerLink="/home" routerLinkActive="active" class="nav-item">
          <i class="fa fa-home"></i> <span>Inicio</span>
        </a>
        <a routerLink="/explore" routerLinkActive="active" class="nav-item">
          <i class="fa fa-compass"></i> <span>Explorar</span>
        </a>

        <div class="nav-section-title desktop-only">Tu Biblioteca</div>
        <a routerLink="/favorites" class="nav-item desktop-only">
          <i class="fa fa-heart"></i> <span>Canciones Favoritas</span>
        </a>
        <a routerLink="/saved" class="nav-item desktop-only">
          <i class="fa fa-bookmark"></i> <span>Álbumes Guardados</span>
        </a>
        <a routerLink="/following" class="nav-item desktop-only">
          <i class="fa fa-users"></i> <span>Artistas que Sigues</span>
        </a>
        <a routerLink="/lists" routerLinkActive="active" class="nav-item">
          <i class="fa fa-list"></i> <span>Mis Listas</span>
        </a>
      </nav>
      <div class="sidebar-footer profile-menu desktop-only">
        <button type="button" class="nav-profile-btn hover-card" (click)="toggleProfileMenu($event)">
          <div class="profile-avatar">
            <img *ngIf="photoURL$ | async as photoURL" [src]="photoURL" alt="">
            <i *ngIf="!(photoURL$ | async)" class="fa fa-user"></i>
          </div>
          <div class="profile-info">
            <span class="profile-name">Mi Perfil</span>
          </div>
          <i class="fa fa-chevron-up profile-menu-caret" [class.open]="profileMenuOpen"></i>
        </button>

        <div class="profile-dropdown" *ngIf="profileMenuOpen">
          <a [routerLink]="['/users', userId]" class="profile-dropdown-item" (click)="closeProfileMenu()">
            <i class="fa fa-user"></i> Mi Perfil
          </a>
          <a routerLink="/settings" class="profile-dropdown-item" (click)="closeProfileMenu()">
            <i class="fa fa-cog"></i> Configuración
          </a>
          <button type="button" class="profile-dropdown-item danger" (click)="logOut()">
            <i class="fa fa-sign-out"></i> Cerrar sesión
          </button>
        </div>
      </div>
    </aside>

    <!-- Columna Central -->
    <main class="main-content">
      <header class="main-header">
        <app-search-bar></app-search-bar>

        <!-- En mobile no hay sidebar izquierdo visible, así que el acceso al
             perfil vive acá, pegado a la búsqueda, en vez de flotar suelto. -->
        <div class="profile-menu header-profile-menu mobile-only">
          <button type="button" class="header-profile-btn" (click)="toggleProfileMenu($event)" aria-label="Menú de perfil">
            <div class="profile-avatar">
              <img *ngIf="photoURL$ | async as photoURL" [src]="photoURL" alt="">
              <i *ngIf="!(photoURL$ | async)" class="fa fa-user"></i>
            </div>
          </button>

          <div class="profile-dropdown" *ngIf="profileMenuOpen">
            <a [routerLink]="['/users', userId]" class="profile-dropdown-item" (click)="closeProfileMenu()">
              <i class="fa fa-user"></i> Mi Perfil
            </a>
            <a routerLink="/settings" class="profile-dropdown-item" (click)="closeProfileMenu()">
              <i class="fa fa-cog"></i> Configuración
            </a>
            <button type="button" class="profile-dropdown-item danger" (click)="logOut()">
              <i class="fa fa-sign-out"></i> Cerrar sesión
            </button>
          </div>
        </div>
      </header>
      <div class="content-scroll">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Sidebar Derecho (Top 50 / Sugerencias) -->
    <aside class="sidebar-right">
      <div class="widget">
        <h3>Destacados</h3>
        <app-album-list layout="sidebar" listType="featured"></app-album-list>
      </div>
      <div class="widget" style="margin-top: 1.5rem;">
        <h3>Últimas listas</h3>
        <app-latest-lists></app-latest-lists>
      </div>
      <div class="widget" style="margin-top: 1.5rem;">
        <h3>Top 50</h3>
        <app-album-list layout="sidebar" listType="top50"></app-album-list>
      </div>
      <div class="widget" style="margin-top: 1.5rem;">
        <h3>Lanzamientos</h3>
        <app-album-list layout="sidebar" listType="new"></app-album-list>
      </div>
    </aside>
  </div>
</ng-container>

<ng-template #unauthLayout>
  <div class="unauth-layout">
    <router-outlet></router-outlet>
  </div>
</ng-template>

<ngx-sonner-toaster/>
