<div *ngIf="song" class="song-page-container">
  
  <div class="song-details glass-panel">
    <div class="album-cover">
      <img [src]="song.album.images[0]?.url" alt="{{ song.name }}" />
    </div>

    <div class="song-info">
      <h2 class="song-title">{{ song.name }}</h2>
      <p class="artist-name">
        <span *ngFor="let artist of song.artists; let isLast = last">
          <a [routerLink]="['/artist', artist.id]" class="artist-link">{{ artist.name }}</a>
          <span *ngIf="!isLast" class="comma">, </span>
        </span>
      </p>
      <p class="album-name">
        <a [routerLink]="['/album', song.album.id]" class="album-link">{{ song.album.name }}</a>
      </p>
      
      <div class="song-meta">
        <span class="meta-item"><i class="fas fa-calendar-alt"></i> {{ song.album.release_date }}</span>
        <span class="meta-item"><i class="fas fa-clock"></i> {{ formatDuration(song.duration_ms) }}</span>
        <span class="meta-item"><i class="fas fa-fire"></i> {{ song.popularity }} / 100 Popularidad</span>
        <span class="meta-item explicit-badge" *ngIf="song.explicit"><i class="fas fa-exclamation-triangle"></i> EXPLICIT</span>
      </div>

      <div class="song-controls">
        <a [href]="song.external_urls.spotify" target="_blank" class="spotify-link">
          Escuchar en Spotify
        </a>
        <button class="list-link" (click)="openAddToList()">
          <i class="fa fa-list"></i> Añadir a lista
        </button>
      </div>
    </div>
  </div>

  <app-add-to-list
    *ngIf="showAddToList"
    itemType="song"
    [itemId]="song.id"
    (close)="showAddToList = false"
  ></app-add-to-list>
</div>
