<div class="auth-shell">
  <div class="form-side">
    <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
      <div class="brand-mark">
        <i class="fa fa-spotify"></i>
        <span>Musicboxd<i class="brand-dot"></i></span>
      </div>

      <div class="form-header">
        <h2>Ingresar a Musicboxd</h2>
        <p>Iniciá sesión para seguir con tu música</p>
      </div>

      <div class="input" [class.has-error]="isRequired('email') || hasEmailError()">
        <label for="email">Correo electrónico</label>
        <div class="input-wrap">
          <i class="fa fa-envelope"></i>
          <input
            id="email"
            formControlName="email"
            type="email"
            placeholder="tu@email.com"
            autocomplete="email"
          />
        </div>
        @if(isRequired('email')){
        <small>Este campo es requerido</small>
        } @if(hasEmailError()){
        <small>El correo no es válido</small>
        }
      </div>

      <div class="input" [class.has-error]="isRequired('password')">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="fa fa-lock"></i>
          <input
            id="password"
            formControlName="password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-visibility"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <i class="fa" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
          </button>
        </div>
        @if(isRequired('password')){
        <small>Este campo es requerido</small>
        }
      </div>

      <div class="botones">
        <button type="submit" [disabled]="form.invalid || isLoading()">
          @if(isLoading()){
          <i class="fa fa-circle-o-notch fa-spin"></i>
          } @else {
          Iniciar Sesión
          }
        </button>

        <div class="divider"><span>o ingresá con</span></div>

        <app-google-button (onClick)="submitWithGoogle()"></app-google-button>
      </div>

      <p class="switch-auth">
        ¿No tenés una cuenta?
        <a routerLink="/auth/sign-up">Creá tu cuenta</a>
      </p>
    </form>
  </div>
</div>
